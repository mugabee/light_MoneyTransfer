services:
  - type: web
    name: ledger
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: RATE_FIAT
        value: RWF
      - key: RATE_MARGIN_PERCENT
        value: "2"
      - key: DB_PATH
        value: /data/ledger.db
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
    disk:
      name: ledger-data
      mountPath: /data
      sizeGB: 1
